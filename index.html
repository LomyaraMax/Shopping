<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Список покупок и дел</title>

  <!-- Подключение шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@500;600;700&family=Neucha&display=swap" rel="stylesheet">

  <!-- Подключение стилей -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1>Покупки и дела</h1>
    </header>

    <main class="main">
      <div class="notebook-wrapper">
        <!-- Вкладки блокнота -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="tasks">
            <span>Дела</span>
            <span id="tasksBadge" class="badge">0</span>
          </button>
          <button class="tab-btn" data-tab="shopping">
            <span>Покупки</span>
            <span id="shoppingBadge" class="badge">0</span>
          </button>
          <button class="tab-btn" data-tab="schedule">
            <span>График</span>
          </button>
        </div>

        <!-- Лист блокнота -->
        <div class="paper-container">
          <div class="margin-line"></div>

          <!-- Раздел: Дела -->
          <section id="tasksSection" class="tasks tab-content active">
            <h2>Дела</h2>
            <ol id="taskList"></ol>
            <div class="input-row">
              <input id="taskInput" type="text" placeholder="Что нужно сделать..." />
              <button id="addTaskBtn" type="button">Добавить</button>
            </div>
          </section>

          <!-- Раздел: Покупки -->
          <section id="shoppingSection" class="list tab-content">
            <h2>Список покупок</h2>
            <ol id="itemList"></ol>
            <div class="input-row">
              <input id="itemInput" type="text" placeholder="Купить..." />
              <button id="addBtn" type="button">Добавить</button>
            </div>
          </section>

          <!-- Раздел: График -->
          <section id="scheduleSection" class="schedule tab-content">
            <h2>График работы</h2>
            
            <div class="calendar-nav">
              <button class="cal-btn" id="prevMonthBtn">←</button>
              <div class="cal-title" id="calMonthTitle">Загрузка...</div>
              <button class="cal-btn" id="nextMonthBtn">→</button>
            </div>

            <div class="cal-legend">
              <div class="leg-item"><span class="leg-dot st-98"></span>98 отд.</div>
              <div class="leg-item"><span class="leg-dot st-163"></span>163 отд.</div>
              <div class="leg-item"><span class="leg-dot st-vh"></span>ВХ</div>
            </div>

            <div class="cal-grid" id="calGrid"></div>
          </section>

          <section class="love">
            <span>Настюшка ❤️ Максюшка 🐶 Лялюшка</span>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- Модалка выбора дня -->
  <div class="modal-overlay" id="shiftModalOverlay">
    <div class="shift-modal-card">
      <div class="modal-title" id="shiftModalTitle">Назначить смену</div>
      <button class="shift-opt-btn opt-98" id="btnShift98">98 Отделение 🟦</button>
      <button class="shift-opt-btn opt-163" id="btnShift163">163 Отделение 🟨</button>
      <button class="shift-opt-btn opt-vh" id="btnShiftVh">Выходной (ВХ) 🟩</button>
      <button class="shift-opt-btn opt-reset" id="btnShiftReset">Сбросить день ✕</button>
    </div>
  </div>

  <!-- Подключение скрипта (модуль) -->
  <script type="module" src="script.js"></script>
</body>
</html>
